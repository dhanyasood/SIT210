<!DOCTYPE html>
<html>

<head>
    <title>Linda's Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Linda's Home</h1>

    <p>Light Control</p>

    <div class="light-card">
        <h2>Living Room</h2>
        <p>Main room light</p>

        <button onclick="controlLight('living room', this)">
            OFF
        </button>
    </div>


    <div class="light-card">
        <h2>Bathroom</h2>
        <p>Bathroom light</p>

        <button onclick="controlLight('bathroom', this)">
            OFF
        </button>
    </div>


    <div class="light-card">
        <h2>Closet</h2>
        <p>Closet light</p>

        <button onclick="controlLight('closet', this)">
            OFF
        </button>
    </div>


    <script src="script.js"></script>

</body>

</html>
